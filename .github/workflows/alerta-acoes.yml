name: Alerta de ações B3

# E-mail a cada 2 horas durante o pregão (seg a sex), horário de Brasília:
# 11h05, 13h05, 15h05 e 17h05  (= 14h05, 16h05, 18h05 e 20h05 UTC)
# A cada 15 min, das 10h às 17h45, só atualiza a foto de preços do painel.
on:
  schedule:
    - cron: "5 14,16,18,20 * * 1-5"
    - cron: "*/15 13-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: alerta-acoes
  cancel-in-progress: false

jobs:
  alerta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar variações e enviar e-mail
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ "${{ github.event.schedule }}" = "*/15 13-20 * * 1-5" ]; then
            python alerta_acoes.py --no-email
          else
            python alerta_acoes.py
          fi

      - name: Salvar foto dos preços no repositório
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add alerts/prices.json alerts/alert_state.json 2>/dev/null || true
          git diff --quiet --cached && exit 0
          git commit -m "Atualiza cotações B3 [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
