name: Monitor ANFAVEA/FENABRAVE

on:
  schedule:
    - cron: "0 12,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor.py

      - name: Salvar state.json atualizado no repositório
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          cp state.json "$RUNNER_TEMP/state.json"
          git add state.json alerts/monitoramento.json
          git diff --quiet --cached && exit 0
          git commit -qm "Atualiza state.json [skip ci]"
          # se outro workflow gravou antes, refaz o monitoramento.json sobre o main novo (sem conflito)
          for i in 1 2 3 4; do
            git push && exit 0
            sleep 5
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/state.json" state.json && python monitoramento.py
            git add state.json alerts/monitoramento.json
            git diff --quiet --cached && exit 0
            git commit -qm "Atualiza state.json [skip ci]"
          done
          exit 1
