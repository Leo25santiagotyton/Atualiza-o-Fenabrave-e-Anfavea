name: Lembrete de resultados

# Todo dia às 8h (Brasília): avisa por e-mail quando faltam 14 e 7 dias para a
# divulgação de resultados das empresas do calendário de RI (alerts/calendario.json).
# Agendado às 7h50 (10h50 UTC) porque o GitHub costuma atrasar o início.
on:
  schedule:
    - cron: "50 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  lembrete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Enviar lembretes
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python lembrete_resultados.py

      - name: Salvar avisos enviados
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add alerts/lembretes_enviados.json 2>/dev/null || true
          git diff --quiet --cached || git commit -m "Lembretes de resultados enviados [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
