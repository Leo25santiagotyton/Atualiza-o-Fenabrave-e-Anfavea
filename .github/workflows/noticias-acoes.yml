name: Boletim de notícias B3 e bonds

# Dois e-mails todo dia às 8h30 e às 19h (horário de Brasília): ações na B3 e bonds em US$.
# Agendado 5 min antes (11h25 e 21h55 UTC) porque o GitHub costuma atrasar o início.
# De hora em hora (minuto 5) só atualiza as notícias do painel, sem e-mail.
on:
  schedule:
    - cron: "25 11 * * *"
    - cron: "55 21 * * *"
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: noticias-acoes
  cancel-in-progress: false

jobs:
  boletim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Buscar notícias e enviar boletins
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ "${{ github.event.schedule }}" = "5 * * * *" ]; then
            python noticias_acoes.py --no-email
          else
            python noticias_acoes.py
          fi

      - name: Salvar notícias no repositório
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add alerts/news.json alerts/news_state.json 2>/dev/null || true
          git diff --quiet --cached && exit 0
          git commit -m "Atualiza notícias B3 [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
