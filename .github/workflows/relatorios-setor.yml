name: Relatórios FENABRAVE/ANFAVEA em tabela

# Dias úteis, a cada 2 horas das 8h20 às 20h20 (Brasília): procura relatório novo
# da FENABRAVE (Informativo de Emplacamentos) e da ANFAVEA (Carta da Anfavea) e,
# quando sai, manda por e-mail as tabelas com volumes e variações.
on:
  schedule:
    - cron: "20 11-23/2 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  relatorios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Ler relatórios e enviar tabelas
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python relatorios_setor.py

      - name: Salvar relatórios enviados
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          cp alerts/setor_state.json "$RUNNER_TEMP/setor_state.json"
          git add alerts/setor_state.json alerts/monitoramento.json 2>/dev/null || true
          git diff --quiet --cached && exit 0
          git commit -qm "Relatórios FENABRAVE/ANFAVEA enviados [skip ci]"
          # se outro workflow gravou antes, refaz o monitoramento.json sobre o main novo (sem conflito)
          for i in 1 2 3 4; do
            git push && exit 0
            sleep 5
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/setor_state.json" alerts/setor_state.json && python monitoramento.py
            git add alerts/setor_state.json alerts/monitoramento.json
            git diff --quiet --cached && exit 0
            git commit -qm "Relatórios FENABRAVE/ANFAVEA enviados [skip ci]"
          done
          exit 1
