name: Debêntures ANBIMA

# Taxas indicativas da ANBIMA, publicadas no fim da tarde dos dias úteis.
# 19h30 e 20h30 de Brasília (22h30 e 23h30 UTC) e, se o arquivo atrasar, de novo às 8h do dia seguinte.
on:
  schedule:
    - cron: "30 22,23 * * 1-5"
    - cron: "0 11 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: debentures-anbima
  cancel-in-progress: false

jobs:
  anbima:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar taxas da ANBIMA
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python debentures_anbima.py

      - name: Salvar histórico no repositório
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add alerts/debentures.json
          git diff --quiet --cached && exit 0
          git commit -m "Atualiza debêntures ANBIMA [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
