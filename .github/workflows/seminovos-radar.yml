name: Radar de seminovos (Movida e Localiza)

# Uma vez por dia lê os preços anunciados nas vitrines de seminovos da Movida e da Localiza
# e atualiza o resumo da aba Monitoramento > Radar de seminovos. 7h40 de Brasília.
on:
  schedule:
    - cron: "40 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: seminovos-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Ler as vitrines
        run: python seminovos_radar.py && python monitoramento.py

      - name: Salvar
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          cp alerts/seminovos_hist.json alerts/seminovos_resumo.json "$RUNNER_TEMP/"
          git add alerts/seminovos_hist.json alerts/seminovos_resumo.json alerts/monitoramento.json
          git diff --quiet --cached && exit 0
          git commit -qm "Radar de seminovos [skip ci]"
          for i in 1 2 3 4; do
            git push && exit 0
            sleep 5
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/seminovos_hist.json" "$RUNNER_TEMP/seminovos_resumo.json" alerts/ && python monitoramento.py
            git add alerts/seminovos_hist.json alerts/seminovos_resumo.json alerts/monitoramento.json
            git diff --quiet --cached && exit 0
            git commit -qm "Radar de seminovos [skip ci]"
          done
          exit 1
