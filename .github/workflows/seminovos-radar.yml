name: Radar de seminovos (Movida, Localiza e Turbi; caminhões Vamos e VolksConfia)

# Toda segunda-feira lê os preços anunciados nas vitrines de seminovos da Movida e da Localiza
# e atualiza o resumo da aba Monitoramento > Radar de seminovos. Segunda, 7h40 de Brasília.
on:
  schedule:
    - cron: "40 10 * * 1"
  workflow_dispatch:
    inputs:
      so:
        description: "Só uma vitrine (movida, localiza, turbi, vamos, volksconfia) ou 'caminhoes'; vazio = todas"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: seminovos-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Ler as vitrines
        env:
          FIPE_TOKEN: ${{ secrets.FIPE_TOKEN }}
          SO: ${{ github.event.inputs.so }}
        run: |
          case "$SO" in
            vamos|volksconfia) python seminovos_radar.py --segmento caminhoes --so "$SO" ;;
            caminhoes) python seminovos_radar.py --segmento caminhoes ;;
            "") python seminovos_radar.py
                python seminovos_radar.py --segmento caminhoes || echo "::warning::radar de caminhões falhou" ;;
            *) python seminovos_radar.py --so "$SO" ;;
          esac
          python monitoramento.py

      - name: Salvar
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          F="alerts/seminovos_hist.json alerts/seminovos_resumo.json alerts/seminovos_fipe.json alerts/caminhoes_hist.json alerts/caminhoes_resumo.json"
          F=$(for f in $F; do [ -f "$f" ] && echo "$f"; done)
          cp $F "$RUNNER_TEMP/"
          git add $F alerts/monitoramento.json
          git diff --quiet --cached && exit 0
          git commit -qm "Radar de seminovos [skip ci]"
          for i in 1 2 3 4; do
            git push && exit 0
            sleep 5
            git fetch -q origin main && git reset -q --hard origin/main
            for f in $F; do cp "$RUNNER_TEMP/$(basename $f)" alerts/; done && python monitoramento.py
            git add $F alerts/monitoramento.json
            git diff --quiet --cached && exit 0
            git commit -qm "Radar de seminovos [skip ci]"
          done
          exit 1
