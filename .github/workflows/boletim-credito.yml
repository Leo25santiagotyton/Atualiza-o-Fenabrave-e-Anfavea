name: Boletim de crédito

# Dias úteis às 8h50 (Brasília). Agendado às 8h40 (11h40 UTC) porque o GitHub
# costuma atrasar o início. Atualiza a ANBIMA antes de montar o e-mail.
on:
  schedule:
    - cron: "40 11 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: debentures-anbima
  cancel-in-progress: false

jobs:
  credito:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Atualizar taxas da ANBIMA e negócios
        run: python debentures_anbima.py

      - name: Salvar histórico no repositório
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add alerts/debentures.json
          git diff --quiet --cached || git commit -m "Atualiza debêntures ANBIMA [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

      - name: Enviar boletim de crédito
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python boletim_credito.py
