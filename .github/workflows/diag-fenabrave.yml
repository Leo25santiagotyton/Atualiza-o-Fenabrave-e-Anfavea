name: Primeiro envio relatorios setor (temporario)
on:
  push:
    branches: [claude/adoring-mendel-ttu2fk]
    paths: [.github/workflows/diag-fenabrave.yml]
permissions:
  contents: write
jobs:
  envio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Enviar tabelas
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python relatorios_setor.py
      - name: Salvar estado
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add alerts/setor_state.json
          git diff --quiet --cached || git commit -m "Relatórios FENABRAVE/ANFAVEA enviados [skip ci]"
          git push
